# Installer configuration for `just build-iso`.
#
# The ISO carries the Anaconda installer, not the image. The kickstart below is what points
# the installed system at the published image, so it has to be pullable without credentials.

[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/shawly/atomc:latest
%end
"""

# Users is what makes Anaconda ask for an account. Without it the installed system has no
# local user, and everything the image does with the primary account (autologin, the tty6
# getty, the session marker under the user's state directory) has nothing to attach to.
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
