# A text console that is already logged in, for when the graphical session is broken.
#
# plasmalogin runs with Relogin=true, so a session that dies during startup comes straight
# back and the graphical console never becomes usable. tty6 is the way in: it is the highest
# VT logind starts on demand (NAutoVTs=6) and the lower numbers are taken by the display
# manager during a session switch.
#
# The empty ExecStart= clears the one in getty@.service before the replacement is appended.
[Service]
ExecStart=
ExecStart=-/usr/libexec/atomc/atomc-getty-autologin %I ${TERM}
