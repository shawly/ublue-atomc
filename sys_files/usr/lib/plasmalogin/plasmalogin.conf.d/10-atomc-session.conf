# Here rather than in /etc/plasmalogin.conf.d, which plasmalogin reads later: this is a
# property of the image and follows image updates, where /etc is machine state a bootc update
# will not touch once written.
#
# Relogin makes a session exit come back to a session instead of the greeter, which is what
# the switch between Bigscreen and Kodi in atomc-session rides on.
[Autologin]
Relogin=true
Session=atomc-session.desktop
