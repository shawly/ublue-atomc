# plasmalogin reads /usr/lib/plasmalogin/plasmalogin.conf.d before /etc/plasmalogin.conf.d,
# so the session belongs here: it is a property of the image and follows image updates,
# while /etc is machine state that a bootc update will not touch once written.
#
# Relogin is what makes a session exit come straight back to a session instead of the
# greeter. The Kodi session switch depends on that behaviour, not just autologin.
[Autologin]
Relogin=true
Session=plasma-bigscreen-wayland.desktop
